name: Build and release Linux package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release-main
  cancel-in-progress: false

jobs:
  release-linux:
    name: Build Linux Mint package
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            build-essential \
            pkg-config

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Debian package
        run: npm run tauri build -- --bundles deb

      - name: Publish latest stable build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            src-tauri/target/release/bundle/deb/*.deb \
            --target "$GITHUB_SHA" \
            --title "Latest Linux build (${GITHUB_SHA::7})" \
            --notes "Automatic Linux Mint build from commit $GITHUB_SHA." \
            --latest
